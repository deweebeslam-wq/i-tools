name: Suggest a feature
description: Ask for a new tool, a new feature, an improvement, an automation or an integration.
title: "[Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Everything you write here is public, and anyone can read it.** Do not include client names, project names, model files, or anything confidential.

        Please search the open issues first, in case someone has already asked for it.
  - type: dropdown
    id: kind
    attributes:
      label: What are you asking for?
      options:
        - New Tool
        - New Feature
        - Improvement
        - Automation Request
        - Integration Request
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: Product family
      options:
        - i-Tools for Revit
        - i-Navis
        - i-Civil
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Related tool
      description: Leave empty for something new.
  - type: input
    id: software
    attributes:
      label: Relevant software
      placeholder: Revit 2025
  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: What you have in mind, and how it is done today.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem being solved
      description: What is slow, repetitive or error-prone.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected functionality
      description: What it should do when it is done.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How soon you need it.
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Reference links or images
      description: Anything that shows what you mean. These become public too.
  - type: checkboxes
    id: public
    attributes:
      label: Public request
      options:
        - label: I understand this request is public, and it contains nothing confidential.
          required: true
